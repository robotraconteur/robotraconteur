name: MinGW

# Builds Robot Raconteur core, RobotRaconteurGen and the C++ tests on Windows
# with the MSYS2 MINGW64 (GCC, MinGW-w64) toolchain, and runs the tests.

on:
  push:
    branches-ignore:
    - ros-**
    - ros2-**
    - ros
    tags:
    - v*
    - '!*ros*'
  pull_request:
    branches-ignore:
    - ros-**
    - ros2-**
    - ros
  workflow_dispatch:

jobs:
  build-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7
      with:
        path: robotraconteur
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-gtest
    - name: configure
      run: >
        cmake -G Ninja -S robotraconteur -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_GEN=ON -DBUILD_TESTING=ON -DBUILD_DOCUMENTATION=OFF
    - name: build
      run: cmake --build build -j 4
    - name: test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error
