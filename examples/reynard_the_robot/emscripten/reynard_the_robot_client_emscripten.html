<!-- reynard_the_robot_client_emscripten.html - Reynard the Robot client using Emscripten -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reynard the Robot Emscripten Client</title>
  </head>
  <body>
    <h1>Reynard the Robot Emscripten Client</h1>
    <h3>Status</h3>
    <div id="status">Loading...</div>

    <h3>Reynard Position</h3>
    <div id="reynard_position"></div>

    <h3>Teleport Reynard</h3>
    x: <input id="teleport_x" placeholder="0.0"/> y: <input id="teleport_y" placeholder="0.0"/> <button id="teleport">Teleport</button>

    <h3>Send a message to Reynard</h3>
    <input id="message" cols="50"/>
    <button id="send_message">Send</button>

    <h3>New Messages from Reynard</h3>
    <div id="received_messages"></div>

    <h3>Error Log</h3>
    <div id="error_log"></div>

    <!-- Load the WebAssembly program compiled by Emscripten. main() runs once it is loaded. -->
    <script src="reynard_the_robot_client_emscripten.js"></script>
  </body>
</html>
